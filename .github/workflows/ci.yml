name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC + Core Check
            compiler: cl
          - name: Clang-CL
            compiler: clang-cl
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          . .github/scripts/Enter-VsDevShell.ps1
          $compiler = if ('${{ matrix.compiler }}' -eq 'clang-cl') { $VsClangCl } else { 'cl' }
          & $compiler --version 2>&1 | Select-Object -First 1
          $output = cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_COMPILER=$compiler" 2>&1
          $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.compiler }}' -eq 'cl' -and -not ($output -match 'C\+\+ Core Check: enabled'))
          {
              Write-Error 'C++ Core Check is not enabled.'
              exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          . .github/scripts/Enter-VsDevShell.ps1
          cmake --build build

      - name: Test
        shell: pwsh
        run: |
          . .github/scripts/Enter-VsDevShell.ps1
          ctest --test-dir build --output-on-failure --no-tests=error

  docs:
    name: Compatibility docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Coverage image and API matrix are up to date
        shell: pwsh
        run: ./tools/Update-Compatibility.ps1 -Check

  lint:
    name: clang-format and clang-tidy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LLVM tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "clang-format~=22.1.0" "clang-tidy~=22.1.0"
          clang-format --version
          clang-tidy --version

      - name: clang-format
        shell: pwsh
        run: |
          $files = git ls-files 'src/*.h' 'src/*.cpp' 'tests/*.h' 'tests/*.cpp'
          clang-format --dry-run --Werror $files

      - name: clang-tidy
        shell: pwsh
        run: |
          $tidy = (Get-Command clang-tidy).Source
          . .github/scripts/Enter-VsDevShell.ps1
          cmake -B build-tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_COMPILER=$VsClangCl" -DOPENERA_ENABLE_CORE_CHECK=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $failed = 0
          foreach ($file in git ls-files 'src/*.cpp' 'tests/*.cpp')
          {
              "::group::$file"
              & $tidy -p build-tidy --quiet $file
              if ($LASTEXITCODE -ne 0) { $failed++ }
              '::endgroup::'
          }
          if ($failed -ne 0)
          {
              Write-Error "clang-tidy failed on $failed file(s)."
              exit 1
          }
